name: AI Agent

on:
  schedule:
    - cron: "17 */3 * * *"    # lead-gen / outreach run, every 3 hours
    - cron: "0 8 * * *"       # social media content - run 1
    - cron: "0 16 * * *"      # social media content - run 2 (safety net in case run 1 didn't finish)
  workflow_dispatch:          # lets you press the "Run workflow" button
    inputs:
      mode:
        description: "What to run (selftest = check everything works, once = a real lead-gen/outreach run, social = today's social content)"
        type: choice
        options:
          - selftest
          - once
          - social
        default: selftest

concurrency:
  group: ai-agent
  cancel-in-progress: false

permissions:
  contents: write   # only used for a tiny monthly "keep-alive" note

jobs:
  run:
    runs-on: self-hosted   # your own PC, instead of GitHub's shared cloud computers
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Check that every file was uploaded
        run: python check_files.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Load your settings (kept secret)
        shell: bash
        env:
          SETTINGS_ENV: ${{ secrets.SETTINGS_ENV }}
        run: |
          python - <<'PY'
          import os, re, sys
          s = os.environ.get("SETTINGS_ENV", "")
          if not s.strip():
              print("PROBLEM: the secret SETTINGS_ENV is empty or missing. Add it in Settings > Secrets and variables > Actions.")
              sys.exit(1)
          open("settings.env", "w").write(s)
          # hide every value from the public logs, just in case
          for line in s.splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              val = re.split(r"\s*<--", line.split("=", 1)[1], maxsplit=1)[0].strip()
              if len(val) >= 6:
                  print("::add-mask::" + val)
          PY

      - name: Decide what to run
        id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 8 * * *" ] || [ "${{ github.event.schedule }}" = "0 16 * * *" ]; then
            echo "mode=social" >> "$GITHUB_OUTPUT"
          else
            echo "mode=once" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the agent
        run: python -m agent ${{ steps.pick.outputs.mode }}

      - name: Keep the schedule alive (GitHub pauses idle repos after 60 days)
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          date -u +%Y-%m > .keepalive
          git config user.name "agent-keepalive"
          git config user.email "agent-keepalive@users.noreply.github.com"
          git add .keepalive
          git commit -m "monthly keepalive" || true
          git push || true
