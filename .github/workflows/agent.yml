name: AI Agent

on:
  schedule:
    - cron: "17 */3 * * *"    # ONE schedule: every 3 hours the agent does lead-gen/outreach AND today's social content together
  workflow_dispatch:          # lets you press the "Run workflow" button
    inputs:
      mode:
        description: "What to run (selftest = check everything works, all = lead-gen + social together, once = lead-gen only, social = social only)"
        type: choice
        options:
          - selftest
          - all
          - once
          - social
        default: selftest

concurrency:
  group: ai-agent
  cancel-in-progress: false   # if the laptop was off and runs piled up, only the newest waiting one is kept - no double runs

permissions:
  contents: write   # only used for a tiny monthly "keep-alive" note

jobs:
  run:
    runs-on: self-hosted   # your own PC, instead of GitHub's shared cloud computers
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Check that every file was uploaded
        run: python check_files.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Load your settings (kept secret)
        env:
          SETTINGS_ENV: ${{ secrets.SETTINGS_ENV }}
        run: python load_settings.py

      - name: Decide what to run
        id: pick
        run: |
          $mode = "all"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = "${{ inputs.mode }}"
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - name: Run the agent
        run: python -m agent ${{ steps.pick.outputs.mode }}

      - name: Keep the schedule alive (GitHub pauses idle repos after 60 days)
        if: github.event_name == 'schedule'
        run: |
          [DateTime]::UtcNow.ToString("yyyy-MM") | Out-File -FilePath .keepalive -Encoding utf8 -NoNewline
          git config user.name "agent-keepalive"
          git config user.email "agent-keepalive@users.noreply.github.com"
          git add .keepalive
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "monthly keepalive"
            git push
          }
          exit 0   # cosmetic keepalive step - must never fail the run
