name: AI Agent

on:
  schedule:
    - cron: "17 */2 * * *"    # ONE schedule: every 2 hours the agent does lead-gen/outreach AND today's social content together
  workflow_dispatch:          # lets you press the "Run workflow" button
    inputs:
      mode:
        description: "What to run (selftest = check everything works, all = lead-gen + social together, once = lead-gen only, social = social only)"
        type: choice
        options:
          - selftest
          - all
          - once
          - social
        default: selftest

concurrency:
  group: ai-agent
  cancel-in-progress: false   # if the laptop was off and runs piled up, only the newest waiting one is kept - no double runs

permissions:
  contents: write   # only used for a tiny monthly "keep-alive" note
  actions: read     # the gate job checks recent runs to see if the self-hosted PC is alive

jobs:
  # ── gate: pick which computer runs the agent this cycle ──────────────
  # TEMPORARY (2026-10-07): the self-hosted PC is OFF for several days, so the
  # gate is forced to the cloud path. When the PC is back, revert this job to
  # the PC-online check (see git history) so runs prefer the free PC again.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      online: ${{ steps.check.outputs.online }}
    steps:
      - name: Force cloud path while the PC is offline
        id: check
        run: |
          echo "gate: forced online=false (PC offline since 2026-10-07; revert when the PC is back)"
          echo "online=false" >> "$GITHUB_OUTPUT"

  # ── run: your own PC (primary - free, no GitHub minutes used) ─────────
  run:
    needs: gate
    if: needs.gate.outputs.online == 'true'
    runs-on: self-hosted   # your own PC, instead of GitHub's shared cloud computers
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Check that every file was uploaded
        run: python check_files.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Load your settings (kept secret)
        env:
          SETTINGS_ENV: ${{ secrets.SETTINGS_ENV }}
        run: python load_settings.py

      - name: Decide what to run
        id: pick
        run: |
          $mode = "all"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = "${{ inputs.mode }}"
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - name: Run the agent
        run: python -m agent ${{ steps.pick.outputs.mode }}

      # Path B: commit queued portal writes + the durable lead queue so Muse can
      # deliver them via its own connection and the next run keeps its state.
      - name: Commit portal queue (Path B)
        if: always()
        run: |
          git config user.name "umair-agent"
          git config user.email "agent@umairconsult.com"
          mkdir -p state portal_queue
          touch state/.gitkeep portal_queue/.gitkeep
          git add portal_queue/pending.jsonl state/leads_queue.json state/agent_state.json state/dnc_cache.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Path B: queue portal writes + lead queue for Muse delivery"
            git push || echo "Push failed (non-fatal)"
          fi

      - name: Keep the schedule alive (GitHub pauses idle repos after 60 days)
        if: github.event_name == 'schedule'
        run: |
          [DateTime]::UtcNow.ToString("yyyy-MM") | Out-File -FilePath .keepalive -Encoding utf8 -NoNewline
          git config user.name "agent-keepalive"
          git config user.email "agent-keepalive@users.noreply.github.com"
          git add .keepalive
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "monthly keepalive"
            git push
          }
          exit 0   # cosmetic keepalive step - must never fail the run

  # ── run-cloud: GitHub's computers (fallback when the PC is offline) ────
  # Same steps as `run`, rewritten for Linux/bash. Only used while the PC
  # is down, so GitHub minutes stay near zero the rest of the time.
  run-cloud:
    needs: gate
    if: needs.gate.outputs.online != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Check that every file was uploaded
        run: python check_files.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Load your settings (kept secret)
        env:
          SETTINGS_ENV: ${{ secrets.SETTINGS_ENV }}
        run: python load_settings.py

      - name: Decide what to run
        id: pick
        run: |
          mode="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run the agent
        run: python -m agent ${{ steps.pick.outputs.mode }}

      # Persist the lead queue + agent state + any queued portal writes so the
      # next run (and Muse's sync job) see them. Committed every run.
      - name: Commit lead queue and portal queue
        if: always()
        run: |
          git config user.name "umair-agent"
          git config user.email "agent@umairconsult.com"
          mkdir -p state portal_queue
          touch state/.gitkeep portal_queue/.gitkeep
          echo "DIAG cwd=$(pwd)"
          echo "DIAG state dir:"; ls -la state/ 2>&1 | head -10
          echo "DIAG git status:"; git status --short 2>&1 | head -10
          git add portal_queue/pending.jsonl state/leads_queue.json state/agent_state.json state/dnc_cache.json 2>&1 || echo "DIAG git add: some paths missing (first run, nothing to commit yet)"
          echo "DIAG staged:"; git diff --cached --name-only 2>&1 | head -10
          if ! git diff --cached --quiet; then
            git commit -m "Agent state: lead queue + portal queue"
            git push || echo "Push failed (non-fatal)"
          else
            echo "DIAG nothing staged - nothing to commit"
          fi

      - name: Keep the schedule alive (GitHub pauses idle repos after 60 days)
        if: github.event_name == 'schedule'
        run: |
          date -u +%Y-%m > .keepalive
          git config user.name "agent-keepalive"
          git config user.email "agent-keepalive@users.noreply.github.com"
          git add .keepalive
          if ! git diff --cached --quiet; then
            git commit -m "monthly keepalive"
            git push
          fi
          exit 0   # cosmetic keepalive step - must never fail the run
