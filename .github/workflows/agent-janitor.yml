# Janitor: un-wedges the main agent workflow if a run ever gets stuck
# waiting on the self-hosted PC (e.g. the PC went offline right after the
# gate routed work to it). Any agent run whose self-hosted `run` job has
# been queued for 50+ minutes is cancelled so the next scheduled cycle can
# proceed on the cloud fallback. Legitimately running jobs are never
# touched - only jobs still waiting for a runner.
name: Agent Janitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: agent-janitor
  cancel-in-progress: true

permissions:
  actions: write   # needed to cancel stuck workflow runs

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel agent runs stuck queueing for a dead runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error, datetime

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]

          def api(path, method="GET"):
              req = urllib.request.Request(
                  "https://api.github.com/repos/%s%s" % (repo, path),
                  method=method,
                  headers={
                      "Authorization": "Bearer %s" % token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read()
                      return r.status, (json.loads(body) if body else None)
              except urllib.error.HTTPError as e:
                  return e.code, None
              except Exception as e:
                  print("api error: %s" % e, flush=True)
                  return 0, None

          def age_min(dt_str):
              try:
                  dt = datetime.datetime.fromisoformat(dt_str.replace("Z", "+00:00"))
              except Exception:
                  return 0
              now = datetime.datetime.now(datetime.timezone.utc)
              return (now - dt).total_seconds() / 60

          cancelled = []
          for status in ("in_progress", "queued"):
              code, data = api("/actions/workflows/agent.yml/runs?per_page=10&status=%s" % status)
              if code != 200 or not data:
                  continue
              for run in data.get("workflow_runs", []):
                  if age_min(run.get("created_at", "")) < 50:
                      continue
                  c2, jobs = api("/actions/runs/%s/jobs?per_page=20" % run["id"])
                  if c2 != 200 or not jobs:
                      continue
                  stuck = any(j.get("name") == "run" and j.get("status") in ("queued", "waiting")
                              for j in jobs.get("jobs", []))
                  if stuck:
                      c3, _ = api("/actions/runs/%s/cancel" % run["id"], method="POST")
                      print("cancel run %s (self-hosted job queued %.0fm): http %s"
                            % (run["id"], age_min(run.get("created_at", "")), c3), flush=True)
                      if c3 in (200, 202):
                          cancelled.append(run["id"])
          print("janitor: cancelled %d stuck run(s)" % len(cancelled), flush=True)
          PYEOF
