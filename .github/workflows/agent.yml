name: AI Agent

on:
  schedule:
    - cron: "17 */2 * * *"    # ONE schedule: every 2 hours the agent does lead-gen/outreach AND today's social content together
  workflow_dispatch:          # lets you press the "Run workflow" button
    inputs:
      mode:
        description: "What to run (selftest = check everything works, all = lead-gen + social together, once = lead-gen only, social = social only)"
        type: choice
        options:
          - selftest
          - all
          - once
          - social
        default: selftest

concurrency:
  group: ai-agent
  cancel-in-progress: false   # if the laptop was off and runs piled up, only the newest waiting one is kept - no double runs

permissions:
  contents: write   # only used for a tiny monthly "keep-alive" note
  actions: read     # the gate job checks recent runs to see if the self-hosted PC is alive

jobs:
  # ── gate: pick which computer runs the agent this cycle ──────────────
  # Always runs on GitHub's cloud. If the self-hosted PC looks online the
  # `run` job takes it; otherwise `run-cloud` runs here instead. Anything
  # uncertain resolves to "offline" so work never queues on a dead PC.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      online: ${{ steps.check.outputs.online }}
    steps:
      - name: Check if the self-hosted runner is online
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error, datetime

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          out_path = os.environ["GITHUB_OUTPUT"]
          RUNNER = "MUHAMMAD_UMAIR-agent"

          def api(path):
              req = urllib.request.Request(
                  "https://api.github.com/repos/%s%s" % (repo, path),
                  headers={
                      "Authorization": "Bearer %s" % token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, None
              except Exception as e:
                  print("api error: %s" % e, flush=True)
                  return 0, None

          def fresh(dt_str, hours):
              try:
                  dt = datetime.datetime.fromisoformat(dt_str.replace("Z", "+00:00"))
              except Exception:
                  return False
              now = datetime.datetime.now(datetime.timezone.utc)
              return (now - dt).total_seconds() < hours * 3600

          online = False
          reason = "no-signal"

          # 1) direct runner status (GITHUB_TOKEN normally cannot read this;
          #    GitHub answers 404/403 -> we fall through to the signals below)
          code, data = api("/actions/runners")
          if code == 200 and data:
              for r in data.get("runners", []):
                  if r.get("name") == RUNNER and r.get("status") == "online":
                      online = True
              reason = "runners-api"
          else:
              # 2a) the lightweight PC probe succeeded in the last 75 minutes
              code, data = api("/actions/workflows/pc-probe.yml/runs?per_page=3&status=completed")
              if code == 200 and data:
                  for run in data.get("workflow_runs", []):
                      if run.get("conclusion") == "success" and fresh(run.get("updated_at", ""), 1.25):
                          online = True
                          reason = "pc-probe-fresh"
                          break
              # 2b) the self-hosted `run` job itself succeeded in the last 4 hours
              #     (note: a `run-cloud` success must NOT count as the PC being up)
              if not online:
                  code, data = api("/actions/workflows/agent.yml/runs?per_page=5&status=completed")
                  if code == 200 and data:
                      for run in data.get("workflow_runs", []):
                          c2, jobs = api("/actions/runs/%s/jobs?per_page=20" % run["id"])
                          if c2 != 200 or not jobs:
                              continue
                          for j in jobs.get("jobs", []):
                              if (j.get("name") == "run"
                                      and j.get("conclusion") == "success"
                                      and fresh(j.get("completed_at", ""), 4)):
                                  online = True
                                  reason = "selfhosted-run-fresh"
                                  break
                          if online:
                              break

          print("gate: online=%s reason=%s" % (online, reason), flush=True)
          with open(out_path, "a") as f:
              f.write("online=%s\n" % ("true" if online else "false"))
          PYEOF

  # ── run: your own PC (primary - free, no GitHub minutes used) ─────────
  run:
    needs: gate
    if: needs.gate.outputs.online == 'true'
    runs-on: self-hosted   # your own PC, instead of GitHub's shared cloud computers
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Check that every file was uploaded
        run: python check_files.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Load your settings (kept secret)
        env:
          SETTINGS_ENV: ${{ secrets.SETTINGS_ENV }}
        run: python load_settings.py

      - name: Decide what to run
        id: pick
        run: |
          $mode = "all"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = "${{ inputs.mode }}"
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - name: Run the agent
        run: python -m agent ${{ steps.pick.outputs.mode }}

      # Path B: commit queued portal writes so Muse can deliver them via its own connection
      - name: Commit portal queue (Path B)
        if: always()
        run: |
          if [ -f portal_queue/pending.jsonl ] && [ -s portal_queue/pending.jsonl ]; then
            git config user.name "umair-agent"
            git config user.email "agent@umairconsult.com"
            git add portal_queue/pending.jsonl
            if ! git diff --cached --quiet; then
              git commit -m "Path B: queue portal writes for Muse delivery"
              git push || echo "Push failed (non-fatal)"
            fi
          fi

      - name: Keep the schedule alive (GitHub pauses idle repos after 60 days)
        if: github.event_name == 'schedule'
        run: |
          [DateTime]::UtcNow.ToString("yyyy-MM") | Out-File -FilePath .keepalive -Encoding utf8 -NoNewline
          git config user.name "agent-keepalive"
          git config user.email "agent-keepalive@users.noreply.github.com"
          git add .keepalive
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "monthly keepalive"
            git push
          }
          exit 0   # cosmetic keepalive step - must never fail the run

  # ── run-cloud: GitHub's computers (fallback when the PC is offline) ────
  # Same steps as `run`, rewritten for Linux/bash. Only used while the PC
  # is down, so GitHub minutes stay near zero the rest of the time.
  run-cloud:
    needs: gate
    if: needs.gate.outputs.online != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Check that every file was uploaded
        run: python check_files.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Load your settings (kept secret)
        env:
          SETTINGS_ENV: ${{ secrets.SETTINGS_ENV }}
        run: python load_settings.py

      - name: Decide what to run
        id: pick
        run: |
          mode="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run the agent
        run: python -m agent ${{ steps.pick.outputs.mode }}

      - name: Keep the schedule alive (GitHub pauses idle repos after 60 days)
        if: github.event_name == 'schedule'
        run: |
          date -u +%Y-%m > .keepalive
          git config user.name "agent-keepalive"
          git config user.email "agent-keepalive@users.noreply.github.com"
          git add .keepalive
          if ! git diff --cached --quiet; then
            git commit -m "monthly keepalive"
            git push
          fi
          exit 0   # cosmetic keepalive step - must never fail the run
