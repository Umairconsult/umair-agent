name: AI Agent

on:
  schedule:
    - cron: "17 */3 * * *"    # lead-gen / outreach run, every 3 hours
    - cron: "0 8 * * *"       # social media content - run 1
    - cron: "0 16 * * *"      # social media content - run 2 (safety net in case run 1 didn't finish)
  workflow_dispatch:          # lets you press the "Run workflow" button
    inputs:
      mode:
        description: "What to run (selftest = check everything works, once = a real lead-gen/outreach run, social = today's social content)"
        type: choice
        options:
          - selftest
          - once
          - social
        default: selftest

concurrency:
  group: ai-agent
  cancel-in-progress: false

permissions:
  contents: write   # only used for a tiny monthly "keep-alive" note

jobs:
  run:
    runs-on: self-hosted   # your own PC, instead of GitHub's shared cloud computers
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Check that every file was uploaded
        run: python check_files.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Load your settings (kept secret)
        env:
          SETTINGS_ENV: ${{ secrets.SETTINGS_ENV }}
        run: python load_settings.py

      - name: Decide what to run
        id: pick
        run: |
          $mode = "once"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = "${{ inputs.mode }}"
          } elseif ("${{ github.event.schedule }}" -eq "0 8 * * *" -or "${{ github.event.schedule }}" -eq "0 16 * * *") {
            $mode = "social"
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - name: Run the agent
        run: python -m agent ${{ steps.pick.outputs.mode }}

      - name: Keep the schedule alive (GitHub pauses idle repos after 60 days)
        if: github.event_name == 'schedule'
        run: |
          Get-Date -AsUTC -Format "yyyy-MM" | Out-File -FilePath .keepalive -Encoding utf8 -NoNewline
          git config user.name "agent-keepalive"
          git config user.email "agent-keepalive@users.noreply.github.com"
          git add .keepalive
          git commit -m "monthly keepalive"
          git push
          exit 0   # nothing new to commit some months - that's fine, don't fail the run over it
